name: C++ CI

on:
  push:
    branches: [ "math_utils_unit_tests" ]
  pull_request:
    branches: [ "math_utils_unit_tests" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile the code
      # This is the standard way to compile a single C++ file
      run: g++ main.cpp -o my_application

    - name: Run the application
      # This ensures the program actually runs without crashing
      run: ./my_application
