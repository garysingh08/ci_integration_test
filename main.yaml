name: C++ CI Workflow

# 1. Triggers: When should this run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # The "runner" (a virtual machine hosted by GitHub)
    runs-on: ubuntu-latest

    steps:
    # 2. Source: Get the code from the repo
    - name: Checkout code
      uses: actions/checkout@v4

    # 3. Environment Setup: Install compiler and build tools
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++

    # 4. Build: Run CMake and Make
    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build Project
      run: cmake --build build

    # 5. Test: Run the resulting executable or test suite
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
